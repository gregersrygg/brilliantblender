name: CI

on:
  pull_request:
  workflow_call:
    inputs:
      upload_pages_artifact:
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Run unit tests
        id: scripts
        run: npm run test:scripts 2>&1 | tee scripts-test-output.log
        continue-on-error: true
      - name: Unit test summary
        if: always()
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            if (!fs.existsSync('scripts-test-output.log')) return;
            const output = fs.readFileSync('scripts-test-output.log', 'utf8');
            const num = (re) => {
              const m = output.match(re);
              return m ? m[1] : '0';
            };
            const pass = parseInt(num(/^ℹ pass (\d+)/m), 10);
            const fail = parseInt(num(/^ℹ fail (\d+)/m), 10);
            const skipped = parseInt(num(/^ℹ skipped (\d+)/m), 10);
            const durationMs = parseFloat(num(/^ℹ duration_ms ([\d.]+)/m));
            const icon = fail > 0 ? '❌' : '✅';
            let md = `## ${icon} Unit Tests (scripts)\n\n| | |\n|---|---|\n`;
            md += `| ✅ Passed | ${pass} |\n`;
            md += `| ❌ Failed | ${fail} |\n`;
            if (skipped) md += `| ⏭️ Skipped | ${skipped} |\n`;
            md += `| ⏱️ Duration | ${(durationMs / 1000).toFixed(2)}s |\n`;
            if (fail > 0) {
              const failing = [...output.matchAll(/^✖ (.*?) \(\d/gm)].map(x => x[1]);
              if (failing.length) {
                md += `\n### Failed Tests\n\n` + failing.map(t => `- ${t}`).join('\n') + '\n';
              }
            }
            await core.summary.addRaw(md).write();
      - run: npx playwright install --with-deps chromium
      - name: Run Playwright tests
        id: playwright
        run: npx playwright test
        continue-on-error: true
      - name: Test summary
        if: always()
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            if (!fs.existsSync('playwright-results.json')) return;
            const { stats, suites = [] } = JSON.parse(fs.readFileSync('playwright-results.json', 'utf8'));
            const { expected, unexpected, skipped, flaky, duration } = stats;
            const icon = unexpected > 0 ? '❌' : '✅';
            const failed = [];
            function walk(suite) {
              for (const s of suite.suites || []) walk(s);
              for (const spec of suite.specs || [])
                if (spec.tests?.some(t => t.status === 'unexpected')) failed.push(spec.title);
            }
            suites.forEach(walk);
            let md = `## ${icon} Playwright Tests\n\n| | |\n|---|---|\n`;
            md += `| ✅ Passed | ${expected} |\n`;
            md += `| ❌ Failed | ${unexpected} |\n`;
            if (flaky)   md += `| ⚠️ Flaky | ${flaky} |\n`;
            if (skipped) md += `| ⏭️ Skipped | ${skipped} |\n`;
            md += `| ⏱️ Duration | ${(duration / 1000).toFixed(1)}s |\n`;
            if (failed.length) {
              md += `\n### Failed Tests\n\n` + failed.map(t => `- ${t}`).join('\n') + '\n';
            }
            await core.summary.addRaw(md).write();
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
      - name: Fail if tests failed
        if: steps.playwright.outcome == 'failure' || steps.scripts.outcome == 'failure'
        run: exit 1
      - run: npm run build
        env:
          VITE_POKEMONTCG_API_KEY: ${{ secrets.API_KEY }}
      - if: inputs.upload_pages_artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist
