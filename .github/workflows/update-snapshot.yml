name: Update card snapshot

on:
  workflow_dispatch:
  schedule:
    - cron: '0 23 * * *' # Every night at 23:00 UTC

permissions:
  contents: write
  actions: write # required to dispatch the legality workflow for special sets

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          token: ${{ secrets.SNAPSHOT_PUSH_TOKEN }}
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run snapshot
      - name: Detect newly added sets and apply main-set legality
        id: legality
        run: |
          # Compare current snapshot's sets.json to the committed (HEAD) version
          # to find newly added setIds. Main sets get their legality entry
          # computed in-place; special sets are emitted to STDOUT for the agent
          # to handle.
          git show HEAD:src/data/sets.json > /tmp/prev-sets.json 2>/dev/null || echo '[]' > /tmp/prev-sets.json
          ALL_NEW=$(node scripts/detect-new-sets.mjs /tmp/prev-sets.json src/data/sets.json src/data/cards.json)
          echo "All new sets:"
          echo "$ALL_NEW" | jq .
          SPECIAL=$(echo "$ALL_NEW" | node scripts/apply-main-set-legality.mjs)
          echo "Special sets remaining for agent:"
          echo "$SPECIAL" | jq .
          {
            echo "special_sets<<EOF"
            echo "$SPECIAL"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          echo "special_count=$(echo "$SPECIAL" | jq 'length')" >> "$GITHUB_OUTPUT"
          echo "new_count=$(echo "$ALL_NEW" | jq 'length')" >> "$GITHUB_OUTPUT"
      - name: Commit and push if changed
        id: commit
        run: |
          if git diff --quiet src/data/; then
            echo "No changes"
            echo "committed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/
          git commit -m "chore: update card snapshot $(date -u +%Y-%m-%d)"
          git push
          echo "committed=true" >> "$GITHUB_OUTPUT"
      - name: Dispatch legality workflow for special sets only
        if: steps.commit.outputs.committed == 'true' && steps.legality.outputs.special_count != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run update-set-legality.lock.yml \
            --ref main \
            -f sets='${{ steps.legality.outputs.special_sets }}'
      - name: Dispatch upcoming-sets workflow when any set was released
        # A released set means the *next* set is already announced on
        # press.pokemon.com (~10-11 week lead), so refresh upcoming-sets.json.
        if: steps.commit.outputs.committed == 'true' && steps.legality.outputs.new_count != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run update-upcoming-sets.lock.yml --ref main
