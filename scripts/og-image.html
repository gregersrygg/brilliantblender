<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; }
  body {
    display: flex;
    align-items: center;
    gap: 56px;
    padding: 0 88px;
    font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    color: #ede9fe;
    background:
      radial-gradient(900px 600px at 18% 30%, rgba(35,196,255,0.22), transparent 60%),
      radial-gradient(900px 600px at 95% 90%, rgba(122,77,255,0.28), transparent 55%),
      #0f0f1a;
    overflow: hidden;
  }
  .logo { flex: 0 0 auto; filter: drop-shadow(0 18px 40px rgba(122,77,255,0.45)); }
  .copy { display: flex; flex-direction: column; gap: 20px; }
  .wordmark {
    font-size: 84px;
    font-weight: 800;
    letter-spacing: -2px;
    line-height: 1;
    background: linear-gradient(90deg, #7dd3fc, #c4b5fd);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .tagline { font-size: 40px; font-weight: 700; color: #ede9fe; letter-spacing: -0.5px; }
  .sub { font-size: 28px; font-weight: 500; color: #a78bfa; max-width: 620px; line-height: 1.35; }
  .url { margin-top: 14px; font-size: 24px; font-weight: 600; color: #7dd3fc; letter-spacing: 0.5px; }
</style>
</head>
<body>
  <div class="logo">
    <svg width="300" height="300" viewBox="0 0 80 80" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#23c4ff"/>
          <stop offset="100%" stop-color="#7a4dff"/>
        </linearGradient>
        <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
          <stop offset="100%" stop-color="#d9f3ff" stop-opacity="0.75"/>
        </linearGradient>
        <linearGradient id="base" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#253046"/>
          <stop offset="100%" stop-color="#111827"/>
        </linearGradient>
        <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
          <feDropShadow dx="0" dy="2" stdDeviation="2" flood-opacity="0.25"/>
        </filter>
      </defs>
      <rect x="4" y="4" width="72" height="72" rx="18" fill="url(#bg)"/>
      <path d="M17 20l2.2 5.8L25 28l-5.8 2.2L17 36l-2.2-5.8L9 28l5.8-2.2L17 20z" fill="#ffffff" opacity="0.9"/>
      <path d="M63 14l1.4 3.6L68 19l-3.6 1.4L63 24l-1.4-3.6L58 19l3.6-1.4L63 14z" fill="#ffffff" opacity="0.75"/>
      <path d="M61 56l1.8 4.8L67.5 63l-4.7 1.8L61 69.5l-1.8-4.7L54.5 63l4.7-2.2L61 56z" fill="#ffffff" opacity="0.75"/>
      <g filter="url(#shadow)">
        <rect x="27" y="16" width="26" height="6" rx="3" fill="#dbe4f0"/>
        <rect x="31" y="13" width="18" height="5" rx="2.5" fill="#f8fafc"/>
        <path d="M29 22h22l-3.5 22a4 4 0 0 1-4 3.4h-7a4 4 0 0 1-4-3.4L29 22z" fill="url(#glass)" stroke="#ffffff" stroke-opacity="0.7" stroke-width="1.2"/>
        <path d="M34 35c4-4 11-4 14 0 1.3 1.6.8 4-1.5 5.2-2.1 1.1-5.5 1.4-8.6.9-4.7-.7-6.3-3.6-3.9-6.1z" fill="#7dd3fc" opacity="0.9"/>
        <path d="M36 33c2.6-1.7 6.9-1.7 9.2.5" fill="none" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round" opacity="0.85"/>
        <path d="M40 38.5l3.5-2.2-1 3.6 3.4 1.2-3.8.7-1 3.7-1-3.7-3.8-.7 3.4-1.2-1-3.6 3.3 2.2z" fill="#ffffff" opacity="0.9"/>
        <rect x="24" y="47" width="32" height="17" rx="8.5" fill="url(#base)"/>
        <circle cx="40" cy="55.5" r="5.2" fill="#0f172a" stroke="#93c5fd" stroke-width="1.2"/>
        <circle cx="40" cy="55.5" r="1.6" fill="#e5e7eb"/>
        <path d="M40 55.5l2.6-2.1" stroke="#e5e7eb" stroke-width="1.2" stroke-linecap="round"/>
        <circle cx="30" cy="55.5" r="2.2" fill="#22d3ee"/>
        <circle cx="50" cy="55.5" r="2.2" fill="#a78bfa"/>
      </g>
      <rect x="4" y="4" width="72" height="72" rx="18" fill="none" stroke="#ffffff" stroke-opacity="0.22"/>
    </svg>
  </div>
  <div class="copy">
    <div class="wordmark">Brilliant Blender</div>
    <div class="tagline">Tournament Pok&eacute;mon TCG Decklist Builder</div>
    <div class="sub">Swap any card to the exact set &amp; number you'll play, then export a tournament-ready list.</div>
    <div class="url">brilliantblender.com</div>
  </div>
</body>
</html>
